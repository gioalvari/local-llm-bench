schema_version: "1"
experiment_id: qwen-0-5b-smoke
output_dir: runs
llama_bench_binary: llama-bench
sample_interval_ms: 100
fail_fast: true
model:
  name: Qwen2.5-0.5B-Instruct-Q4_K_M
  path: models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
  source_repo: bartowski/Qwen2.5-0.5B-Instruct-GGUF
  source_revision: 41ba88dbac95fed2528c92514c131d73eb5a174b
  sha256: 6eb923e7d26e9cea28811e1a8e852009b21242fb157b26149d3b188f3a8c8653
  quantization: Q4_K_M
matrix:
  repetitions: 3
  workloads:
    - name: short
      prompt_tokens: 128
      generation_tokens: 64
    - name: standard
      prompt_tokens: 512
      generation_tokens: 128
  batch_sizes: [128, 512]
  ubatch_sizes: [128]
  threads: [10]
  gpu_layers: [0, -1]
  flash_attention: ["off", "on"]
server:
  prompt: "Explain in two sentences why electricity grids must balance supply and demand."
  repetitions: 5
  output_tokens: 64
  context_size: 2048
  batch_size: 512
  ubatch_size: 128
  threads: 10
  gpu_layers: -1
  flash_attention: "on"
  parallel: 1
evaluation:
  dataset: datasets/energy/eia-electricity-smoke.jsonl
  prompt_arms: [zero-shot, engineered]
  output_tokens: 96
load:
  concurrency_levels: [1, 2, 4]
  waves_per_level: 3
  warmup_requests: 1
open_loop:
  prompt_dataset: datasets/load/energy-prompts.jsonl
  arrival_rates_rps: [2, 4, 8, 12]
  duration_seconds: 3
  warmup_requests: 1
  server_slots: 4
  max_client_workers: 32
  latency_slo_ms: 500
  cooldown_seconds: 0.5
context_sweep:
  corpus: datasets/context/energy-market.txt
  repetitions: 3
  warmup_requests: 1
  output_tokens: 64
  cases:
    - name: window-256-prompt-128
      series: [window-size]
      context_size: 256
      prompt_tokens: 128
    - name: window-1024-prompt-128
      series: [window-size]
      context_size: 1024
      prompt_tokens: 128
    - name: window-2048-prompt-128
      series: [window-size]
      context_size: 2048
      prompt_tokens: 128
    - name: window-4096-prompt-128
      series: [window-size, prompt-length]
      context_size: 4096
      prompt_tokens: 128
    - name: window-4096-prompt-512
      series: [prompt-length]
      context_size: 4096
      prompt_tokens: 512
    - name: window-4096-prompt-1024
      series: [prompt-length]
      context_size: 4096
      prompt_tokens: 1024
    - name: window-4096-prompt-2048
      series: [prompt-length]
      context_size: 4096
      prompt_tokens: 2048
training:
  source_dataset: datasets/training/energy-market-qa.jsonl
  model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
  model_revision: a5339a4131f135d0fdc6a5c8b5bbed2753bbe0f3
  model_sha256: 8eb92e234f43ed1826f02aafd04c1bd210fe7bb028fc1341935b633bad2b0cd3
  iterations: 30
  batch_size: 1
  gradient_accumulation_steps: 1
  num_layers: 4
  learning_rate: 0.00001
  max_seq_length: 512
  mask_prompt: true
  seed: 42
