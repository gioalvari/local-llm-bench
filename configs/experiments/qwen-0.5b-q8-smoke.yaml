  sha256: 25130a98aa782284a7dabea0c23245b2fd371ed47244e79d78b8ec23245fdf96
  quantization: Q8_0
matrix:
  repetitions: 3
  workloads:
    - name: short
      prompt_tokens: 128
      generation_tokens: 64
    - name: standard
      prompt_tokens: 512
      generation_tokens: 128
  batch_sizes: [128, 512]
  ubatch_sizes: [128]
  threads: [10]
  gpu_layers: [0, -1]
  flash_attention: ["off", "on"]
server:
  prompt: "Explain in two sentences why electricity grids must balance supply and demand."
  repetitions: 5
  output_tokens: 64
  context_size: 2048
  batch_size: 512
  ubatch_size: 128
  threads: 10
  gpu_layers: -1
  flash_attention: "on"
  parallel: 1
evaluation:
  dataset: datasets/energy/eia-electricity-smoke.jsonl
  prompt_arms: [zero-shot, engineered]
  output_tokens: 96
load:
  concurrency_levels: [1, 2, 4]
  waves_per_level: 3
  warmup_requests: 1
open_loop:
  prompt_dataset: datasets/load/energy-prompts.jsonl
  arrival_rates_rps: [2, 4, 8, 12]
  duration_seconds: 3
  warmup_requests: 1
  server_slots: 4
  max_client_workers: 32
  latency_slo_ms: 500
  cooldown_seconds: 0.5
context_sweep:
  corpus: datasets/context/energy-market.txt
  repetitions: 3
  warmup_requests: 1
  output_tokens: 64
  cases:
    - name: window-256-prompt-128
      series: [window-size]
      context_size: 256
      prompt_tokens: 128
    - name: window-1024-prompt-128
      series: [window-size]
      context_size: 1024
      prompt_tokens: 128
    - name: window-2048-prompt-128
      series: [window-size]
      context_size: 2048
      prompt_tokens: 128
    - name: window-4096-prompt-128
      series: [window-size, prompt-length]
      context_size: 4096
      prompt_tokens: 128
    - name: window-4096-prompt-512
      series: [prompt-length]
      context_size: 4096
      prompt_tokens: 512
    - name: window-4096-prompt-1024
      series: [prompt-length]
      context_size: 4096
      prompt_tokens: 1024
    - name: window-4096-prompt-2048
      series: [prompt-length]
      context_size: 4096
      prompt_tokens: 2048
