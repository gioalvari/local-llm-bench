schema_version: "1"
experiment_id: qwen-0-5b-q8-smoke
output_dir: runs
llama_bench_binary: llama-bench
sample_interval_ms: 100
fail_fast: true
model:
  name: Qwen2.5-0.5B-Instruct-Q8_0
  path: models/Qwen2.5-0.5B-Instruct-Q8_0.gguf
