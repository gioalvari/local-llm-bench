[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localllm-bench"
version = "0.1.0"
description = "Reproducible, quality-aware benchmarks for local LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Giordano Alvari" }]
dependencies = [
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "types-psutil>=6.1,<8",
  "types-pyyaml>=6.0,<7",
]
mlx = ["mlx-lm[train]>=0.22,<1"]

[project.scripts]
llmb = "localllm_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/localllm_bench"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
