<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="470" viewBox="0 0 1170 470" role="img" aria-labelledby="title desc">
<title id="title">Open-loop saturation and SLO goodput</title>
<desc id="desc">Line chart of offered, achieved, and SLO-compliant request rates plus SLO attainment bars from 2 to 12 requests per second.</desc>
<rect width="1170" height="470" rx="18" fill="#0d1117"/>
