<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="350" viewBox="0 0 1170 350" role="img" aria-labelledby="title desc">
<title id="title">LocalLLM Bench experiment lifecycle</title>
<desc id="desc">A reproducible pipeline from pinned YAML configuration through host probing, isolated runners, raw artifacts, and quality-aware analysis.</desc>
<rect width="1170" height="350" rx="18" fill="#0d1117"/>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e6edf3}.muted{fill:#8b949e}.label{font-size:13px}.small{font-size:11px}.title{font-size:24px;font-weight:700}.value{font-size:15px;font-weight:700}</style>
<text x="50" y="52" class="title">One experiment, three objective axes</text>
<text x="50" y="80" class="muted label">Same checkpoint. Same hardware. Measured speed, memory, and quality.</text>
