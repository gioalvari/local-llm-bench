<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="455" viewBox="0 0 1170 455" role="img" aria-labelledby="title desc">
<title id="title">Context window and prompt length effects</title>
<desc id="desc">Two line charts show median time to first token as prompt length increases and peak RSS as the configured context window increases.</desc>
<rect width="1170" height="455" rx="18" fill="#0d1117"/>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e6edf3}.muted{fill:#8b949e}.label{font-size:13px}.small{font-size:11px}.title{font-size:24px;font-weight:700}.value{font-size:15px;font-weight:700}</style>
<text x="45" y="48" class="title">Prompt occupancy drives latency; reserved window drives memory</text>
<text x="45" y="74" class="muted label">Two controlled series separate tokens processed from KV capacity allocated.</text>
<rect x="60.0" y="105" width="500" height="310" rx="14" fill="#161b22"/>
<text x="82.0" y="138" class="value">Actual prompt length</text>
<text x="82.0" y="160" class="muted small">Median TTFT (ms)</text>
<line x1="115.0" y1="355.0" x2="515.0" y2="355.0" stroke="#30363d"/>
<text x="105.0" y="359.0" text-anchor="end" class="muted small">0</text>
<line x1="115.0" y1="272.5" x2="515.0" y2="272.5" stroke="#30363d"/>
<text x="105.0" y="276.5" text-anchor="end" class="muted small">210</text>
<line x1="115.0" y1="190.0" x2="515.0" y2="190.0" stroke="#30363d"/>
<text x="105.0" y="194.0" text-anchor="end" class="muted small">420</text>
<polyline points="115.00,345.46 248.33,318.54 381.67,281.28 515.00,199.87" fill="none" stroke="#e782a9" stroke-width="4"/>
<circle cx="115.00" cy="345.46" r="5" fill="#e782a9"/>
<text x="115.00" y="382" text-anchor="middle" class="small">128</text>
<circle cx="248.33" cy="318.54" r="5" fill="#e782a9"/>
<text x="248.33" y="382" text-anchor="middle" class="small">512</text>
<circle cx="381.67" cy="281.28" r="5" fill="#e782a9"/>
<text x="381.67" y="382" text-anchor="middle" class="small">1024</text>
<circle cx="515.00" cy="199.87" r="5" fill="#e782a9"/>
<text x="515.00" y="382" text-anchor="middle" class="small">2048</text>
<rect x="620.0" y="105" width="500" height="310" rx="14" fill="#161b22"/>
<text x="642.0" y="138" class="value">Configured context window</text>
<text x="642.0" y="160" class="muted small">Peak RSS (MiB)</text>
<line x1="675.0" y1="355.0" x2="1075.0" y2="355.0" stroke="#30363d"/>
<text x="665.0" y="359.0" text-anchor="end" class="muted small">0</text>
<line x1="675.0" y1="272.5" x2="1075.0" y2="272.5" stroke="#30363d"/>
<text x="665.0" y="276.5" text-anchor="end" class="muted small">280</text>
<line x1="675.0" y1="190.0" x2="1075.0" y2="190.0" stroke="#30363d"/>
<text x="665.0" y="194.0" text-anchor="end" class="muted small">560</text>
<polyline points="675.00,209.06 808.33,206.94 941.67,202.91 1075.00,195.78" fill="none" stroke="#56d4dd" stroke-width="4"/>
<circle cx="675.00" cy="209.06" r="5" fill="#56d4dd"/>
<text x="675.00" y="382" text-anchor="middle" class="small">256</text>
<circle cx="808.33" cy="206.94" r="5" fill="#56d4dd"/>
<text x="808.33" y="382" text-anchor="middle" class="small">1024</text>
<circle cx="941.67" cy="202.91" r="5" fill="#56d4dd"/>
<text x="941.67" y="382" text-anchor="middle" class="small">2048</text>
<circle cx="1075.00" cy="195.78" r="5" fill="#56d4dd"/>
<text x="1075.00" y="382" text-anchor="middle" class="small">4096</text></svg>
